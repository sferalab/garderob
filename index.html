<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Конструктор гардеробной ТИТАН GS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;500;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="app">
<div id="viewWrap"><div id="photoBg"></div><div id="view"></div>
<div class="tools"><button id="menuT">☰ Вид и размеры</button>
<button data-cam="front">Прямо</button><button data-cam="iso">45°</button><button data-cam="top">Сверху</button><button data-cam="card">Карточка</button>
<button id="dT">Общая длина</button><button id="dS">Секции</button><button id="dV">Вертикальные</button><button id="dC">Между полками</button><button id="dAll">Все вкл</button><button id="dNone">Все выкл</button><button id="pngBtn" class="acc">Скачать картинку</button>
</div>
<div id="hint">Вращайте пальцем или мышью, колесико или щипок для масштаба</div>
</div>
<div id="panel">
<div class="grp"><h3>Общие настройки</h3>
<label>Интерьер<select id="preset"><option value="warm">Теплая солнечная</option><option value="none">Нейтральная студия</option></select></label>
<label class="chk"><input type="checkbox" id="decor"> Декор (ковер, штора)</label>
<label class="chk"><input type="checkbox" id="sunT"> Солнце и тени от окна</label>
<label>Показывать<select id="viewMode"><option value="all">Все</option><option value="frame">Только каркас</option><option value="fill">Только наполнение</option></select></label>
<label>Цвет штанги<select id="rodC"><option value="chrome">Хром</option><option value="white">Белая</option><option value="black">Черная</option></select></label>
<label>Цвет металла<select id="metal"><option value="white">Белый (RAL 9016)</option><option value="black">Черный (RAL 9005)</option><option value="graphite">Графит</option></select></label>
<div class="row2"><label>Цвет стены<input type="color" id="wall"><select id="wallTone"><option value="">Готовые тона…</option><option value="#ecdcc8">Светло-бежевый (как на карточке)</option><option value="#e8d3bd">Теплый бежевый</option><option value="#f2efe9">Молочный</option><option value="#dcd9d3">Светло-серый</option></select></label><label>Пол<select id="floor"><option value="oak">Светлый дуб (как на карточке)</option><option value="walnut">Доска состаренная</option><option value="parquet">Паркет елочкой</option><option value="tile">Мрамор</option><option value="concrete">Бетон</option></select></label></div>
<div class="row2"><label>Высота стоек, мм<select id="postH"><option>512</option><option>1025</option><option>1156</option><option>1536</option><option>1920</option><option>2304</option><option value="custom">свое значение</option></select></label><label>Свое, мм<input type="number" id="postHc" min="300" max="3000" step="1"></label></div>
<label>Верх рельса от пола, см<input type="number" id="railTop" min="60" max="320" step="1"></label>
<div class="row2"><label>Количество секций<input type="number" id="nSec" min="1" max="12" step="1"></label><label>Ширина всех секций, см<select id="allW"><option value="">—</option><option>60</option><option>90</option><option>120</option></select></label></div>
<div id="summary" class="sum"></div>
</div>
<div class="grp"><h3>Секции</h3><div id="secTabs" class="tabs"></div><div id="secEdit"></div></div>
<div class="grp"><h3>Карточка для маркетплейса 900×1200</h3>
<label>Шрифт<select id="cFont"><option value="manrope">Manrope (современный, по умолчанию)</option><option value="montserrat">Montserrat</option><option value="inter">Inter</option><option value="playfair">Playfair Display + Manrope (элегантный)</option></select></label>
<label class="chk"><input type="checkbox" id="cTOn"> Заголовок</label><input type="text" id="cTitle">
<label class="chk"><input type="checkbox" id="cSOn"> Габариты</label><input type="text" id="cSize">
<label class="chk"><input type="checkbox" id="cPOn"> Панель «КОМПЛЕКТАЦИЯ»</label><textarea id="cPanel" rows="5"></textarea>
<label>Положение панели<select id="cPos"><option value="auto">Авто (не закрывать гардеробную)</option><option value="tl">Сверху слева</option><option value="tr">Сверху справа</option><option value="bl">Снизу слева</option><option value="br">Снизу справа</option><option value="cr">Справа по центру</option></select></label>
<label class="chk"><input type="checkbox" id="cNOn"> Нижняя надпись (последняя строка крупно)</label><textarea id="cNote" rows="2"></textarea>
<label class="chk"><input type="checkbox" id="cDims"> Размерные линии на карточке</label>
<div class="btns"><button id="cAuto">Заполнить из спецификации</button><button id="cardBtn" class="acc">Скачать карточку</button></div></div>
<div class="grp" id="photoGrp"><h3>Фото стены клиента</h3>
<label class="file">Загрузить фото<input type="file" id="photo" accept="image/*"></label>
<div id="photoCtl" class="hide">
<label>Сдвиг влево / вправо<input type="range" id="mx" min="-3" max="3" step="0.01" value="0"></label>
<label>Сдвиг вверх / вниз<input type="range" id="my" min="-2" max="2" step="0.01" value="0"></label>
<label>Масштаб<input type="range" id="ms" min="0.3" max="3" step="0.01" value="1"></label>
<label>Поворот<input type="range" id="mr" min="-60" max="60" step="1" value="0"></label>
<label class="chk"><input type="checkbox" id="showRoom"> Показывать стену и пол</label>
<button id="photoOff">Убрать фото</button></div>
</div>
<div class="grp"><h3>Сохранение</h3>
<div class="btns"><button id="saveBtn">Сохранить</button><button id="loadBtn">Загрузить</button><button id="shareBtn">Ссылка на конфигурацию</button><button id="resetBtn" class="danger">Сбросить</button></div>
<p class="foot">Картинка скачивается с теми размерами, которые сейчас включены.</p>
<div id="msg" class="sum"></div></div>
<p class="foot">Размеры элементов взяты из каталога ТИТАН GS 2024. Визуализация ориентировочная.</p>
</div></div>
<script type="module" src="app.js"></script>
</body></html>
